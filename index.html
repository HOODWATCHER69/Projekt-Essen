<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Was soll ich kochen?</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>

<body>
<div class="container">

    <h1>🍽️ Was soll ich kochen?</h1>

    <!-- MODUS AUSWAHL -->
    <div class="modus-toggle">
        <label class="modus-box">
            <input type="checkbox" id="modusMichel">
            Michel
        </label>

        <label class="modus-box">
            <input type="checkbox" id="modusNick">
            Nick
        </label>
    </div>

    <label for="kategorie">Kategorie auswählen:</label>
    <select id="kategorie">
        <option value="">Alle</option>
        <option value="Schnell">Schnell</option>
        <option value="Nudeln">Nudeln</option>
        <option value="Spätzle">Spätzle</option>
        <option value="Reis">Reis</option>
        <option value="Vegetarisch">Vegetarisch</option>
        <option value="Süß">Süß</option>
    </select>

    <button onclick="zufaelligesGericht()">
        🎲 Zufälliges Gericht vorschlagen
    </button>

    <div id="ausgabe" class="card"></div>

</div>

<script>

// ---------- EXKLUSIVE MODUS-AUSWAHL ----------

const michelBox = document.getElementById("modusMichel");
const nickBox = document.getElementById("modusNick");

michelBox.addEventListener("change", function() {
    if (this.checked) {
        nickBox.checked = false;
    }
});

nickBox.addEventListener("change", function() {
    if (this.checked) {
        michelBox.checked = false;
    }
});

// ---------- GERICHTE ----------

const gerichte = [
    { name: "Pizza", kategorien: [], modi: ["Nick"] },
    { name: "Zopf", kategorien: [], modi: ["Nick"] },
    { name: "Flammkuchen", kategorien: [], modi: ["Nick"] },
    { name: "Sandwiches", kategorien: ["Schnell"], modi: ["Michel", "Nick"] },
    { name: "Burger", kategorien: [], modi: ["Michel", "Nick"] },
    { name: "Nachos", kategorien: [], modi: ["Michel", "Nick"] },
    { name: "Burritos", kategorien: [], modi: ["Michel", "Nick"] },
    { name: "Bolognese", kategorien: ["Nudeln"], modi: ["Michel", "Nick"] },
    { name: "Carbonara", kategorien: ["Nudeln"], modi: ["Michel", "Nick"] },
    { name: "Risotto", kategorien: ["Reis", "Vegetarisch"], modi: ["Michel", "Nick"] },
    { name: "Nudelauflauf", kategorien: ["Nudeln", "Vegetarisch"], modi: ["Michel", "Nick"] },
    { name: "Tortelliniauflauf", kategorien: ["Nudeln", "Vegetarisch"], modi: ["Michel", "Nick"] },
    { name: "Kässpatzn", kategorien: ["Vegetarisch"], modi: ["Michel", "Nick"] },
    { name: "Geschnetzeltes", kategorien: ["Spätzle", "Reis"], modi: ["Michel", "Nick"] },
    { name: "Brotzeit", kategorien: ["Schnell"], modi: ["Michel", "Nick"] },
    { name: "Hühnerfrikassee", kategorien: ["Reis"], modi: ["Michel", "Nick"] },
    { name: "Asianudeln", kategorien: ["Nudeln"], modi: ["Michel", "Nick"] },
    { name: "Asiafleisch", kategorien: ["Reis"], modi: ["Michel", "Nick"] },
    { name: "Schmandgemüse", kategorien: ["Vegetarisch"], modi: ["Michel", "Nick"] },
    { name: "Baconröllchen", kategorien: ["Spätzle", "Nudeln"], modi: ["Michel", "Nick"] },
    { name: "Lasagne", kategorien: ["Nudeln"], modi: ["Michel", "Nick"] },
    { name: "Salat", kategorien: ["Schnell", "Vegetarisch"], modi: ["Michel", "Nick"] },
    { name: "Wraps", kategorien: ["Vegetarisch", "Schnell"], modi: ["Michel", "Nick"] },
    { name: "Chicken Wings", kategorien: [], modi: ["Michel", "Nick"] },
    { name: "Pulled Chicken", kategorien: [], modi: ["Michel", "Nick"] },
    { name: "Spinat", kategorien: ["Vegetarisch"], modi: ["Michel", "Nick"] },
    { name: "Kartoffelgratin", kategorien: ["Kartoffeln", "Vegetarisch"], modi: ["Michel", "Nick"] },
    { name: "Mettbrötchen", kategorien: ["Schnell"], modi: ["Michel", "Nick"] },
    { name: "Hackbällchen", kategorien: [], modi: ["Michel", "Nick"] },
    { name: "Bratkartoffeln", kategorien: ["Vegetarisch"], modi: ["Michel", "Nick"] },
    { name: "Tortellini (weiß)", kategorien: ["Nudeln", "Schnell"], modi: ["Michel", "Nick"] },
    { name: "Eiersalat", kategorien: ["Schnell", "Vegetarisch"], modi: ["Michel", "Nick"] },
    { name: "Kartoffelsalat", kategorien: ["Vegetarisch"], modi: ["Michel", "Nick"] },
    { name: "Grillen", kategorien: [], modi: ["Michel", "Nick"] },
    { name: "Kasseler & Sauerkraut", kategorien: ["Schnell"], modi: ["Michel", "Nick"] },
    { name: "Flammkuchen", kategorien: [], modi: ["Michel", "Nick"] },
    { name: "Pfannkuchen", kategorien: ["Vegetarisch", "Süß"], modi: ["Michel", "Nick"] },
    { name: "Waffeln", kategorien: ["Vegetarisch", "Süß"], modi: ["Michel", "Nick"] },
    { name: "Nudeln mit Tomatensauce", kategorien: ["Vegetarisch", "Nudeln", "Schnell"], modi: ["Michel", "Nick"] },
    { name: "Kartoffelpuffer", kategorien: ["Vegetarisch"], modi: ["Michel", "Nick"] }
];

// ---------- HAUPTFUNKTION ----------

function zufaelligesGericht() {

    const ausgewaehlteKategorie = document.getElementById("kategorie").value;

    const michelAktiv = michelBox.checked;
    const nickAktiv = nickBox.checked;

    let passendeGerichte = gerichte;

    // Modus-Filter (nur wenn einer aktiv)
    if (michelAktiv || nickAktiv) {
        passendeGerichte = passendeGerichte.filter(g =>
            (michelAktiv && g.modi.includes("Michel")) ||
            (nickAktiv && g.modi.includes("Nick"))
        );
    }

    // Kategorie-Filter
    if (ausgewaehlteKategorie !== "") {
        passendeGerichte = passendeGerichte.filter(g =>
            g.kategorien.includes(ausgewaehlteKategorie)
        );
    }

    if (passendeGerichte.length === 0) {
        document.getElementById("ausgabe").textContent =
            "❌ Kein passendes Gericht gefunden.";
        return;
    }

    const zufall = Math.floor(Math.random() * passendeGerichte.length);
    const gericht = passendeGerichte[zufall];

    document.getElementById("ausgabe").textContent =
        "👉 Vorschlag für heute: " + gericht.name;
}

</script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
