<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Was soll ich kochen?</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">

</head>

<body>
    <div class="container">

        <h1>🍽️ Was soll ich kochen?</h1>

        <label for="kategorie">Kategorie auswählen:</label>
        <select id="kategorie">
            <option value="">Alle</option>
            <option value="Schnell">Schnell</option>
            <option value="Nudeln">Nudeln</option>
            <option value="Spätzle">Spätzle</option>
            <option value="Reis">Reis</option>
            <option value="Vegetarisch">Vegetarisch</option>
            <option value="Süß">Süß</option>
        </select>

        <button onclick="zufaelligesGericht()">
            🎲 Zufälliges Gericht vorschlagen
        </button>

        <div id="ausgabe" class="card"></div>

    </div>

<script>
const gerichte = [
    { name: "Pizza", kategorien: [] },
    { name: "Zopf", kategorien: [] },
    { name: "Flammkuchen", kategorien: [] },
    { name: "Sandwiches", kategorien: ["Schnell"] },
    { name: "Burger", kategorien: [] },
    { name: "Nachos", kategorien: [] },
    { name: "Burritos", kategorien: [] },
    { name: "Bolognese", kategorien: ["Nudeln"] },
    { name: "Carbonara", kategorien: ["Nudeln"] },
    { name: "Risotto", kategorien: ["Reis", "Vegetarisch"] },
    { name: "Nudelauflauf", kategorien: ["Nudeln", "Vegetarisch"] },
    { name: "Tortelliniauflauf", kategorien: ["Nudeln", "Vegetarisch"] },
    { name: "Kässpatzn", kategorien: ["Vegetarisch"] },
    { name: "Geschnetzeltes", kategorien: ["Spätzle", "Reis"] },
    { name: "Brotzeit", kategorien: ["Schnell"] },
    { name: "Hühnerfrikassee", kategorien: ["Reis"] },
    { name: "Asianudeln", kategorien: ["Nudeln"] },
    { name: "Asiafleisch", kategorien: ["Reis"] },
    { name: "Schmandgemüse", kategorien: ["Vegetarisch"] },
    { name: "Baconröllchen", kategorien: ["Spätzle", "Nudeln"] },
    { name: "Lasagne", kategorien: ["Nudeln"] },
    { name: "Salat", kategorien: ["Schnell", "Vegetarisch"] },
    { name: "Wraps", kategorien: ["Vegetarisch", "Schnell"] },
    { name: "Chicken Wings", kategorien: [] },
    { name: "Pulled Chicken", kategorien: [] },
    { name: "Spinat", kategorien: ["Vegetarisch"] },
    { name: "Kartoffelgratin", kategorien: ["Kartoffeln", "Vegetarisch"] },
    { name: "Mettbrötchen", kategorien: ["Schnell"] },
    { name: "Hackbällchen", kategorien: [] },    
    { name: "Bratkartoffeln", kategorien: ["Vegetarisch"] },
    { name: "Tortellini (weiß)", kategorien: ["Nudeln", "Schnell"] },
    { name: "Eiersalat", kategorien: ["Schnell", "Vegetarisch"] },
    { name: "Kartoffelsalat", kategorien: ["Vegetarisch"] },
    { name: "Grillen", kategorien: [] },
    { name: "Kasseler & Sauerkraut", kategorien: ["Schnell"] },
    { name: "Flammkuchen", kategorien: [] },
    { name: "Pfannkuchen", kategorien: ["Vegetarisch", "Süß"] },
    { name: "Waffeln", kategorien: ["Vegetarisch", "Süß"] },
    { name: "Nudeln mit Tomatensauce", kategorien: ["Vegetarisch", "Nudeln", "Schnell"] },
    { name: "Kartoffelpuffer", kategorien: ["Vegetarisch"] }
];

function zufaelligesGericht() {
    const ausgewaehlteKategorie = document.getElementById("kategorie").value;

    let passendeGerichte = gerichte;

    if (ausgewaehlteKategorie !== "") {
        passendeGerichte = gerichte.filter(g =>
            g.kategorien.includes(ausgewaehlteKategorie)
        );
    }

    if (passendeGerichte.length === 0) {
        document.getElementById("ausgabe").textContent =
            "❌ Kein Gericht in dieser Kategorie gefunden.";
        return;
    }

    const zufall = Math.floor(Math.random() * passendeGerichte.length);
    const gericht = passendeGerichte[zufall];

    document.getElementById("ausgabe").textContent =
        "👉 Vorschlag für heute: " + gericht.name;
}
</script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>


</body>

</html>
